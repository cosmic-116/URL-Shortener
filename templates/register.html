{% extends "base.html" %}
{% block title %}Sign Up — Snip{% endblock %}
{% block content %}

<header class="nav-floating">
    <a href="/" class="logo-minimal">
        Snip<div class="dot"></div>
    </a>
    <div class="nav-links">
        <a href="/login" class="nav-cta">Log In</a>
    </div>
</header>

<div class="auth-container">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 32px;">
            <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 8px;">Create Account.</h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Start shortening, securing, and analyzing links instantly.</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" placeholder="Choose a username" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="Choose a secure password" required>
            </div>
            
            <button type="submit" class="btn-primary" style="margin-top: 12px;">
                <span>Create Free Account</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 28px; font-size: 13.5px; color: var(--text-secondary);">
            Already have an account? 
            <a href="{{ url_for('login') }}" style="color: var(--text-primary); font-weight: 600; text-decoration: none; margin-left: 4px;">Log In</a>
        </div>
    </div>
</div>

{% endblock %}
