<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Your Snip Account</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #f8fafc;">
<table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #0b0f19; padding: 40px 16px;">
    <tr>
        <td align="center">
            <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 520px; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 36px 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                <tr>
                    <td align="left">
                        <div style="font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; margin-bottom: 24px;">
                            Snip<span style="color: #10b981;">.</span>
                        </div>
                        <h1 style="font-size: 22px; font-weight: 700; color: #ffffff; margin: 0 0 12px 0; letter-spacing: -0.02em;">
                            Verify your email address
                        </h1>
                        <p style="font-size: 14px; color: #94a3b8; line-height: 1.6; margin: 0 0 16px 0;">
                            Please enter this 6-digit verification code to complete your Snip registration. It expires in {{ expires_minutes|default(10) }} minutes.
                        </p>
                        <div style="background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; text-align: center; margin: 24px 0;">
                            <span style="font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 32px; font-weight: 800; letter-spacing: 6px; color: #10b981; display: inline-block;">
                                {{ code }}
                            </span>
                        </div>
                        <p style="font-size: 12px; color: #64748b; line-height: 1.5; margin-top: 24px; border-top: 1px solid #1e293b; padding-top: 16px;">
                            If you did not attempt to sign up for Snip, no action is needed.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
