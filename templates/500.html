{% extends "base.html" %}
{% block title %}500{% endblock %}
{% block content %}
<div style="min-height:100vh; background:#0f0f1a; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; position:relative; overflow:hidden;">
    <div style="position:absolute; user-select:none; pointer-events:none; font-size:clamp(240px,28vw,360px); font-weight:900; letter-spacing:-0.05em; opacity:0.03; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; line-height:1;">500</div>
    <div style="font-size:clamp(100px,14vw,180px); font-weight:900; letter-spacing:-0.05em; line-height:1; margin-bottom:20px; filter:drop-shadow(0 0 40px rgba(168,85,247,0.25)); color:#a855f7;">500</div>
    <h1 style="font-size:clamp(22px,3.5vw,32px); font-weight:800; letter-spacing:-0.03em; color:#f0f0f8; margin-bottom:12px;">Internal Server Error</h1>
    <p style="font-size:15px; color:#6b7190; text-align:center; max-width:440px; line-height:1.7; margin-bottom:36px;">
        An unexpected error occurred while processing your request. Our telemetry system has logged this incident.
    </p>
    <a href="/" class="btn-primary" style="padding:12px 32px; font-size:14px; text-decoration:none; width:auto; border-radius:var(--radius-sm);">← Return to Home</a>
    <div style="position:absolute; bottom:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, rgba(168,85,247,0.3), transparent);"></div>
</div>
{% endblock %}
