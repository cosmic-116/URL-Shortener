{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}

<header class="nav-floating">
    <a href="/" class="logo-minimal">
        <div class="brand-symbol">
            <svg class="scissors-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <g class="blade-top">
                    <circle cx="6" cy="18" r="3" stroke-width="2.2"/>
                    <path d="M8.12 15.88L12 12L20 4" stroke-width="2.2"/>
                </g>
                <g class="blade-bottom">
                    <circle cx="6" cy="6" r="3" stroke-width="2.2"/>
                    <path d="M8.12 8.12L12 12L20 20" stroke-width="2.2"/>
                </g>
                <circle cx="12" cy="12" r="1.5" fill="#040407"/>
                <line class="scissor-spark" x1="18" y1="12" x2="23" y2="12" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </div>
        <span class="brand-text">Snip</span><span class="dot"></span>
    </a>
    <div class="nav-links">
        <a href="/login" class="nav-cta">Back to Log In</a>
    </div>
</header>

<div class="auth-container">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 52px; height: 52px; border-radius: 50%; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: #60a5fa;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 6px;">Reset Password.</h1>
            <p style="color: var(--text-secondary); font-size: 13.5px; line-height: 1.5;">
                Enter your verified account email. We'll send a 6-digit recovery code.
            </p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="forgotEmail">Email Address</label>
                <input type="email" id="forgotEmail" name="email" class="form-input" placeholder="you@domain.com" required autofocus autocomplete="email">
            </div>
            
            <button type="submit" class="btn-primary" style="margin-top: 12px;">
                <span>Send Reset Code</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
            Remembered your password? 
            <a href="{{ url_for('login') }}" style="color: var(--text-primary); font-weight: 600; text-decoration: none; margin-left: 4px;">Log In</a>
        </div>
    </div>
</div>

{% endblock %}
